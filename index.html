<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e8">
<title>Назад в 1972</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#171816;--muted:#74756f;--accent:#203c34;--line:#deded8;--paper:#eee3ca;--red:#8e3029;--shadow:0 16px 40px rgba(25,25,20,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#171b19}button,input{font:inherit}.app{width:100%;max-width:460px;min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow:hidden;transition:background .7s ease,color .7s ease}.app[data-era="warm"]{--bg:#f2ede2;--card:#fbf7ed;--accent:#3d4a3b}.app[data-era="paper"]{--bg:#e9dfc8;--card:#f3ead6;--accent:#352f27;--line:#cfc1a3;background-image:repeating-linear-gradient(0deg,rgba(70,55,35,.025) 0 1px,transparent 1px 4px)}.app[data-era="1972"]{--bg:#ded2b9;--card:#eee4ce;--accent:#29251f;--line:#bcae91;font-family:Georgia,"Times New Roman",serif;background-image:repeating-linear-gradient(0deg,rgba(55,45,30,.035) 0 1px,transparent 1px 3px)}
.screen{min-height:100vh;padding:22px 20px 30px;display:flex;flex-direction:column;animation:in .35s ease}.hidden{display:none!important}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}.era{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}.menu{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:20px;color:var(--ink)}h1,h2,h3,p{margin:0}h1{font-size:46px;line-height:.92;letter-spacing:-.055em}h2{font-size:31px;line-height:1.04;letter-spacing:-.035em}h3{font-size:19px;line-height:1.2}.lead{font-size:17px;line-height:1.55;color:#494b46}.small{font-size:13px;line-height:1.45;color:var(--muted)}.spacer{flex:1}.stack{display:flex;flex-direction:column;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.question{font-size:24px;line-height:1.22;font-weight:760;letter-spacing:-.025em}.btn{width:100%;border:0;border-radius:16px;padding:16px 18px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn:active{transform:scale(.99)}.choices{display:grid;gap:10px}.choice{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;font-weight:700;color:var(--ink)}.choice.wrong{animation:shake .3s;border-color:#b84b43}.choice.correct{border-color:#3d735d;background:#edf5ef}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px;font-size:16px;color:var(--ink);outline:none}input:focus{border-color:var(--accent)}.feedback{min-height:22px;font-size:14px;font-weight:700}.ok{color:#397057}.bad{color:#a23c35}.location{border:1px dashed var(--accent);border-radius:20px;padding:18px;background:color-mix(in srgb,var(--card) 82%,transparent)}.location .label{font-size:11px;letter-spacing:.16em;font-weight:900;color:var(--accent);margin-bottom:7px}.location strong{font-size:21px}.code{display:flex;gap:8px}.code input{text-align:center;font-size:24px;letter-spacing:.3em;font-weight:800}.year{font-size:86px;line-height:1;font-weight:900;letter-spacing:-.07em}.center{text-align:center;align-items:center;justify-content:center}.divider{height:1px;background:var(--line);margin:5px 0}.photo{width:100%;min-height:250px;border-radius:18px;background:#d8d2c4;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}.photo img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain}.photo span{padding:30px;text-align:center;font-size:13px;letter-spacing:.1em;color:#69655c}.timeline{height:3px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}.timeline i{display:block;height:100%;background:var(--accent);transition:width .5s}.notice{padding:14px 16px;border-left:3px solid var(--accent);background:var(--card);font-size:15px;line-height:1.5}.big-label{font-size:12px;letter-spacing:.18em;font-weight:900}.date-grid{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px}.date-grid input{text-align:center;font-weight:800}.final-copy{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.6}.overlay{position:fixed;inset:0;background:rgba(12,14,13,.58);display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(420px,100%);background:var(--card);border-radius:22px;padding:20px}.timewarp{position:fixed;inset:0;z-index:20;background:#161613;color:#efe7d4;display:grid;place-items:center;text-align:center}.timewarp .warp-year{font:900 96px/1 Georgia,serif;animation:pulse .55s ease}@keyframes pulse{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:900;text-transform:uppercase;color:var(--accent)}.start-mark{width:112px;height:112px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;margin:34px auto;font:700 15px Georgia,serif;letter-spacing:.08em}.start-mark:after{content:"1972";font-size:28px}.result{font-size:18px;line-height:1.5}.fadeout{animation:fadeout 1s forwards}@keyframes fadeout{to{opacity:0;background:#111}}
</style>
</head>
<body><main class="app" id="app" data-era="modern"></main>
<script>
const Q={
 universityPhoto:'images/university.jpg', universityAge:20,
 codes:{masya:'5837',keys:'2419',sponges:'7642',album:'3185',tools:'9274',backpack:'4516',bedroom:'6831',bread:'2057'},
 physicalWord:'хакасская слива'
};
const steps=[
 {era:'2026',type:'choice',title:'Для начала — простой вопрос',q:'Кому на самом деле принадлежит этот дом, диван и всё, что находится внутри?',opts:['Мне','Вике','Ульяне','Масе'],answer:'Масе',after:'Верно. Мы все здесь, судя по всему, просто живём с его разрешения.',loc:'Лежанка Маси',code:'masya'},
 {era:'2026',type:'choice',q:'Что папа обязательно возьмёт с собой, даже если нужно выйти из дома всего на пять минут?',opts:['Телефон','Кошелёк','Воду','Ключи'],answer:'Ключи',after:'Правильно. Хотя правильнее было бы сказать не «ключи», а огромная связка ключей… Возможно, половина из них уже ничего не открывает. Но рисковать мы не будем.',loc:'На крючке с ключами в коридоре',code:'keys'},
 {era:'Переход',type:'transition',heading:'С настоящим разобрались.',text:'Теперь начинаем двигаться назад.',year:'2026'},
 {era:'Взрослая жизнь',type:'text',q:'Сколько лет назад была создана самая крутая компания по производству самых крутых губок?',answers:['29','29 лет','29 лет назад'],after:'Точно. Некоторые вещи с возрастом становятся только лучше. Видимо, губки тоже.',loc:'Кухня, ящик с губками',code:'sponges'},
 {era:'Университет',type:'photo',q:'Сколько тебе здесь лет?',after:'Неплохо. Память пока работает. А фотографии, между прочим, помнят ещё больше.',loc:'Фотоальбом',code:'album'},
 {era:'Молодость',type:'any',q:'Какая машина была у тебя первой?',after:'Записано. Будем считать, что исторические источники это подтверждают.'},
 {era:'Старшие классы',type:'text',intro:'В старших классах у тебя появилось одно увлечение, которое довольно быстро тебя затянуло. На него уходило много времени, внимания и, подозреваю, терпения окружающих.',q:'Что это было?',answers:['радиотехника','радио техника','радиолюбительство','радиолюбитель'],after:'Точно. Старый радиолюбитель всё помнит.',loc:'Ящик с инструментами',code:'tools'},
 {era:'Школьные годы',type:'any',q:'Какой предмет в школе был твоим любимым?',after:'Правильный ответ! Так и запишем: именно этот предмет сделал тебя тем, кем ты стал. Наверное.'},
 {era:'Школьные годы',type:'any',q:'Как звали твоего лучшего друга в школе?',after:'Ответ принят. Проверить мы это всё равно не можем, поэтому поверим на слово.',loc:'Рюкзак Ульяны',code:'backpack'},
 {era:'Переход',type:'transition',heading:'Мы уже довольно далеко от 2026 года.',text:'Теперь пора вернуться туда, где всё начиналось.'},
 {era:'Детство',type:'any',q:'Как называлась улица, на которой ты жил в детстве?',after:'Когда-то твоя кровать стояла совсем в другом доме, на той самой улице. С тех пор изменилось многое, но место для следующей подсказки осталось вполне очевидным.',loc:'Спальня, рядом с кроватью',code:'bedroom'},
 {era:'Начало 70-х',type:'transition',heading:'Мы всё ближе.',text:'Начало 70-х',paper:true},
 {era:'Начало 70-х',type:'blitz'},
 {era:'Начало 70-х',type:'choice',intro:'Машина времени продолжает движение. Представим, что на дворе начало 70-х и тебе нужно сходить в магазин.',q:'Сколько стоил батон хлеба весом около 400 г?',opts:['7 копеек','13 копеек','25 копеек','1 рубль 10 копеек'],answer:'13 копеек',after:'13 копеек. Сегодня с таким бюджетом поход в магазин будет несколько сложнее. Но деньги тебе не понадобятся. Ищи сам хлеб.',loc:'Хлебница / место, где дома лежит хлеб',code:'bread'},
 {era:'Почти 1972',type:'physical'},
 {era:'1972',type:'warp'},
 {era:'1972',type:'date'},
 {era:'1972',type:'finalLocation'},
 {era:'1972',type:'final'}
];
const blitz=[
 {q:'Папа или фильм «Иван Васильевич меняет профессию»?',opts:['ПАПА','ФИЛЬМ'],answer:'ПАПА',after:'Папа! Фильм вышел в 1973 году.'},
 {q:'Папа или первый полностью электронный настольный калькулятор?',opts:['ПАПА','КАЛЬКУЛЯТОР'],answer:'КАЛЬКУЛЯТОР',after:'Калькулятор. ANITA Mark VIII появился ещё в 1961 году.'},
 {q:'Папа или первый звонок с ручного мобильного телефона?',opts:['ПАПА','МОБИЛЬНЫЙ ЗВОНОК'],answer:'ПАПА',after:'Папа. Первый такой звонок состоялся 3 апреля 1973 года.'}
];
const app=document.getElementById('app'); let state=JSON.parse(localStorage.getItem('back1972')||'null')||{started:false,step:0,phase:'question',blitz:0};
function save(){localStorage.setItem('back1972',JSON.stringify(state))} function norm(v){return String(v).trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ')}
function eraTheme(era){if(era==='1972')return'1972';if(era.includes('70')||era==='Почти 1972')return'paper';if(['Молодость','Старшие классы','Школьные годы','Детство','Университет'].includes(era))return'warm';return'modern'}
function shell(body,era){app.dataset.era=eraTheme(era);app.innerHTML=`<section class="screen"><div class="top"><div><div class="era">${era}</div><div class="timeline"><i style="width:${Math.max(4,(state.step/(steps.length-1))*100)}%"></i></div></div><button class="menu" onclick="menu()">⋯</button></div>${body}</section>`}
function next(){state.step=Math.min(state.step+1,steps.length-1);state.phase='question';state.blitz=0;save();render()}
function menu(){app.insertAdjacentHTML('beforeend',`<div class="overlay" id="ov"><div class="modal stack"><h3>Настройки путешествия</h3><p class="small">Текущий прогресс сохраняется автоматически.</p><button class="btn alt" onclick="document.getElementById('ov').remove()">Отмена</button><button class="btn" onclick="confirmReset()">Начать квест заново</button></div></div>`)}
function confirmReset(){document.getElementById('ov').innerHTML=`<div class="modal stack"><h3>Начать путешествие заново?</h3><p class="lead">Весь текущий прогресс будет удалён.</p><button class="btn alt" onclick="document.getElementById('ov').remove()">Отмена</button><button class="btn" onclick="resetQuest()">Начать заново</button></div>`}function resetQuest(){localStorage.removeItem('back1972');state={started:false,step:0,phase:'question',blitz:0};render()}
function start(){state.started=true;save();shell(`<div class="spacer"></div><div class="stack center"><div class="eyebrow">Точка отправления</div><div class="year">2026</div><p class="lead">Маршрут построен.</p></div><div class="spacer"></div><button class="btn" onclick="render()">НАЧАТЬ ПУТЕШЕСТВИЕ</button>`,'2026')}
function render(){if(!state.started){app.dataset.era='modern';app.innerHTML=`<section class="screen"><div class="eyebrow">Персональный маршрут</div><div class="start-mark"></div><div class="stack"><h1>НАЗАД<br>В 1972</h1><p class="lead">Сегодня тебе предстоит небольшое путешествие.<br><br>Но двигаться мы будем не вперёд. А назад.<br><br>Тебе предстоит пройти несколько заданий, вспомнить кое-что о себе и постепенно добраться до одной очень важной даты.</p></div><div class="spacer"></div><button class="btn" onclick="start()">НАЧАТЬ</button></section>`;return} const s=steps[state.step]; if(s.type==='transition')return transition(s); if(s.type==='blitz')return blitzRender(); if(s.type==='physical')return physical(); if(s.type==='warp')return warp(); if(s.type==='date')return dateStep(); if(s.type==='finalLocation')return finalLocation(); if(s.type==='final')return finalScreen(); question(s)}
function question(s){if(state.phase==='after')return after(s);let media='';if(s.type==='photo')media=`<div class="photo"><img src="${Q.universityPhoto}" alt="Фотография из университета" onerror="this.remove();this.parentNode.innerHTML='<span>ФОТОГРАФИЯ ИЗ УНИВЕРСИТЕТА</span>'"></div>`;let input='';if(s.type==='choice')input=`<div class="choices">${s.opts.map(o=>`<button class="choice" onclick='pick(this,${JSON.stringify(o)},${JSON.stringify(s.answer)})'>${o}</button>`).join('')}</div>`;else input=`<input id="answer" ${s.type==='photo'?'inputmode="numeric"':''} placeholder="Введи ответ" onkeydown="if(event.key==='Enter')checkText()"><button class="btn" onclick="checkText()">ПРОДОЛЖИТЬ</button>`;shell(`<div class="stack">${s.title?`<div class="eyebrow">${s.title}</div>`:''}${s.intro?`<p class="lead">${s.intro}</p>`:''}${media}<div class="card stack"><div class="question">${s.q}</div>${input}<div class="feedback" id="fb"></div></div></div>`,s.era)}
function pick(btn,val,ans){if(val===ans){btn.classList.add('correct');setTimeout(()=>{state.phase='after';save();render()},350)}else{btn.classList.add('wrong');document.getElementById('fb').innerHTML='<span class="bad">Не совсем. Попробуй ещё раз.</span>';setTimeout(()=>btn.classList.remove('wrong'),400)}}
function checkText(){let s=steps[state.step],v=document.getElementById('answer').value,ok=false;if(!norm(v))return fb('Нужно что-нибудь ввести :)',false);if(s.type==='any')ok=true;else if(s.type==='photo'){let n=parseInt(v,10);ok=Number.isFinite(n)&&Math.abs(n-Q.universityAge)<=1}else ok=s.answers.map(norm).includes(norm(v));if(ok){state.phase='after';save();render()}else fb('Не похоже. Попробуй ещё раз.',false)} function fb(t,ok=true){document.getElementById('fb').innerHTML=`<span class="${ok?'ok':'bad'}">${t}</span>`}
function after(s){let code=s.code?`<div class="location"><div class="label">ГДЕ ИСКАТЬ</div><strong>${s.loc}</strong></div><div class="card stack"><h3>Нашёл записку?</h3><div class="small">Введи четырёхзначный код:</div><div class="code"><input id="code" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="_ _ _ _"></div><button class="btn" onclick="checkCode('${s.code}')">ПРОДОЛЖИТЬ</button><div class="feedback" id="fb"></div></div>`:`<button class="btn" onclick="next()">${s.type==='any'?'СЛЕДУЮЩИЙ ВОПРОС':'ДАЛЬШЕ'}</button>`;shell(`<div class="stack"><div class="notice">${s.after}</div>${code}</div><div class="spacer"></div>`,s.era)}
function checkCode(k){let v=document.getElementById('code').value.replace(/\D/g,'');if(v===Q.codes[k]){fb('КОД ПРИНЯТ ✓');setTimeout(next,650)}else fb('Не тот код. Ищи внимательнее :)',false)}
function transition(s){shell(`<div class="spacer"></div><div class="stack center">${s.year?`<div class="year">${s.year}</div>`:''}<h2>${s.heading}</h2><p class="lead">${s.text}</p></div><div class="spacer"></div><button class="btn" onclick="next()">ПРОДОЛЖИТЬ</button>`,s.era)}
function blitzRender(){let b=blitz[state.blitz];if(state.phase==='blitzAfter'){shell(`<div class="spacer"></div><div class="stack center"><div class="eyebrow">БЛИЦ ${state.blitz+1} ИЗ 3</div><h2>${b.after}</h2></div><div class="spacer"></div><button class="btn" onclick="blitzNext()">ДАЛЬШЕ</button>`,'Начало 70-х');return}shell(`<div class="stack"><div class="eyebrow">ВНИМАНИЕ · КТО СТАРШЕ?</div><p class="lead">Мы приближаемся к началу 70-х. Пора выяснить, что успело появиться раньше тебя, а что — уже после.</p><div class="card stack"><div class="question">${b.q}</div><div class="choices">${b.opts.map(o=>`<button class="choice" onclick='blitzPick(this,${JSON.stringify(o)})'>${o}</button>`).join('')}</div><div class="feedback" id="fb"></div></div></div>`,'Начало 70-х')}
function blitzPick(btn,v){let b=blitz[state.blitz];if(v===b.answer){btn.classList.add('correct');state.phase='blitzAfter';save();setTimeout(render,350)}else{btn.classList.add('wrong');fb('Нет. Ещё попытка.',false);setTimeout(()=>btn.classList.remove('wrong'),400)}}function blitzNext(){if(state.blitz<2){state.blitz++;state.phase='question';save();render()}else{shell(`<div class="spacer"></div><div class="stack center"><div class="eyebrow">ПРОВЕРКА ЗАВЕРШЕНА</div><h2>Папа официально старше 2 из 3 перечисленных вещей.</h2><p class="lead">Но сохранился заметно лучше.</p></div><div class="spacer"></div><button class="btn" onclick="next()">ПРОДОЛЖИТЬ ПУТЕШЕСТВИЕ</button>`,'Начало 70-х')}}
function physical(){if(state.phase==='physicalCheck'){shell(`<div class="stack"><div class="eyebrow">ВНИМАНИЕ</div><p class="lead">До точки назначения осталось совсем немного. Но перед перемещением в 1972 год система должна убедиться, что пассажир физически готов к путешествию.</p><div class="card stack"><div class="big-label">ЗАДАНИЕ</div><div class="question">Круто подпрыгни два раза.</div><p class="small">После успешного выполнения задания Уля выдаст тебе кодовое слово.</p></div><div class="card stack"><h3>Введи кодовое слово</h3><input id="answer" placeholder="Кодовое слово"><button class="btn" onclick="checkPhysical()">ПРОВЕРИТЬ</button><div class="feedback" id="fb"></div></div></div>`,'Почти 1972');return}shell(`<div class="spacer"></div><div class="stack center"><div class="eyebrow">ВНИМАНИЕ</div><h2>Физическая проверка пассажира</h2><p class="lead">До точки назначения осталось совсем немного.</p></div><div class="spacer"></div><button class="btn" onclick="state.phase='physicalCheck';save();render()">ПРОДОЛЖИТЬ</button>`,'Почти 1972')}
function checkPhysical(){if(norm(document.getElementById('answer').value)===norm(Q.physicalWord)){shell(`<div class="spacer"></div><div class="stack center"><div class="eyebrow">ПРОВЕРКА ПРОЙДЕНА ✓</div><h2>Физическое состояние: удовлетворительное.</h2><p class="lead">Возраст признан формальностью.<br>Доступ к 1972 году разрешён.</p></div><div class="spacer"></div><button class="btn" onclick="next()">ПЕРЕМЕСТИТЬСЯ</button>`,'Почти 1972')}else fb('Кодовое слово не принято.',false)}
function warp(){shell(`<div class="spacer"></div><div class="stack center"><div class="eyebrow">МАШИНА ВРЕМЕНИ ГОТОВА</div><h2>Следующая остановка — 1972</h2></div><div class="spacer"></div><button class="btn" onclick="runWarp()">ПЕРЕМЕСТИТЬСЯ</button>`,'Почти 1972')}
function runWarp(){let years=['1975','1974','1973','1972'],i=0;document.body.insertAdjacentHTML('beforeend','<div class="timewarp" id="warp"><div><div class="small">ПЕРЕМЕЩЕНИЕ</div><div class="warp-year" id="wy">1975</div></div></div>');let el=document.getElementById('wy');let timer=setInterval(()=>{i++;if(i>=years.length){clearInterval(timer);setTimeout(()=>{document.getElementById('warp').remove();next()},650);return}el.textContent=years[i];el.classList.remove('warp-year');void el.offsetWidth;el.classList.add('warp-year')},700)}
function dateStep(){shell(`<div class="stack"><div class="eyebrow">Мы почти на месте.</div><h2>Осталось определить только один день.</h2><div class="card stack"><div class="question">Введи дату своего рождения</div><div class="date-grid"><input id="dd" maxlength="2" inputmode="numeric" placeholder="ДД" oninput="jump(this,'mm',2)"><input id="mm" maxlength="2" inputmode="numeric" placeholder="ММ" oninput="jump(this,'yy',2)"><input id="yy" maxlength="4" inputmode="numeric" placeholder="ГГГГ"></div><button class="btn" onclick="checkDate()">ПРОДОЛЖИТЬ</button><div class="feedback" id="fb"></div></div></div>`,'1972')}
function jump(el,id,n){el.value=el.value.replace(/\D/g,'').slice(0,n);if(el.value.length===n)document.getElementById(id).focus()}function checkDate(){if(document.getElementById('dd').value.padStart(2,'0')==='05'&&document.getElementById('mm').value.padStart(2,'0')==='09'&&document.getElementById('yy').value==='1972'){app.classList.add('fadeout');setTimeout(()=>{app.classList.remove('fadeout');shell(`<div class="spacer"></div><div class="stack center"><div class="big-label">ТОЧКА НАЗНАЧЕНИЯ ДОСТИГНУТА</div><div class="year" style="font-size:64px">5 СЕНТЯБРЯ<br><span style="font-size:90px">1972</span></div></div><div class="spacer"></div><button class="btn" onclick="next()">ПРОДОЛЖИТЬ</button>`,'1972')},1000)}else fb('Дата не совпала. Попробуй ещё раз.',false)}
function finalLocation(){shell(`<div class="spacer"></div><div class="stack"><h2>Путешествие почти закончено.</h2><p class="lead">Осталось найти то, ради чего мы сюда отправились.</p><div class="location"><div class="label">ФИНАЛЬНАЯ ТОЧКА</div><strong>Загляни в барабан стиральной машины.</strong></div></div><div class="spacer"></div><button class="btn" onclick="next()">Я НАШЁЛ</button>`,'1972')}
function finalScreen(){shell(`<div class="stack"><div class="eyebrow">5 сентября 1972</div><h1 style="font-size:44px">С ДНЁМ<br>РОЖДЕНИЯ!</h1><div class="divider"></div><div class="final-copy">Вернуться в этот день мы, конечно, не можем.<br><br>Но кое-что оттуда достать получилось.<br><br>Перед тобой настоящий выпуск газеты «Правда», который вышел 5 сентября 1972 года.<br><br>Пока страна жила своей обычной жизнью, люди шли на работу, строили планы и читали эти новости, произошло событие, которое для нашей семьи оказалось намного важнее всего написанного на этих страницах.<br><br><strong>В этот день родился ты.</strong><br><br>С днём рождения, папа ❤️</div></div><div class="spacer"></div>`,'1972')}
render();
</script></body></html>
